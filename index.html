<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Lab PDF Personalizer</title>
  <meta name="description" content="Personalize your Java Lab PDF files with your name. Everything runs in your browser - no data is ever sent anywhere.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>
  <!-- Animated background -->
  <div class="bg-animation">
    <div class="gradient-blob blob-1"></div>
    <div class="gradient-blob blob-2"></div>
    <div class="gradient-blob blob-3"></div>
    <div class="floating-symbols" aria-hidden="true"></div>
  </div>

  <!-- Theme toggle -->
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light theme">
    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></g></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <!-- Main card -->
  <main class="main-container">
    <div class="glass-card" id="mainCard">
      <!-- Header -->
      <header class="card-header">
        <div class="logo-mark">
          <svg viewBox="0 0 32 32" width="32" height="32"><rect x="2" y="2" width="28" height="28" rx="6" fill="var(--accent)" opacity="0.15"/><text x="16" y="22" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="16" fill="var(--accent)">J</text></svg>
        </div>
        <div>
          <h1 class="card-title">Java Lab PDF Personalizer</h1>
          <p class="card-subtitle">Generate personalized Java lab PDFs with your name in the terminal</p>
        </div>
      </header>

      <!-- Progress indicator -->
      <div class="progress-bar" role="progressbar" aria-valuenow="1" aria-valuemin="1" aria-valuemax="3">
        <div class="progress-step active" data-step="1">
          <div class="step-circle">1</div>
          <span class="step-label">Name</span>
        </div>
        <div class="progress-line"><div class="progress-line-fill"></div></div>
        <div class="progress-step" data-step="2">
          <div class="step-circle">2</div>
          <span class="step-label">Layout</span>
        </div>
        <div class="progress-line"><div class="progress-line-fill"></div></div>
        <div class="progress-step" data-step="3">
          <div class="step-circle">3</div>
          <span class="step-label">Download</span>
        </div>
      </div>

      <!-- Step 1: Name input -->
      <section class="step-section" id="step1" aria-label="Enter your name">
        <div class="input-group">
          <input type="text" id="nameInput" class="name-input" maxlength="30" autocomplete="off" aria-describedby="nameHint charCount" placeholder=" ">
          <label for="nameInput" class="floating-label">Enter your name</label>
          <div class="input-icon" id="inputIcon">
            <svg class="check-icon" viewBox="0 0 24 24" width="24" height="24"><polyline points="20 6 9 17 4 12" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="input-meta">
            <span class="name-hint" id="nameHint" role="alert"></span>
            <span class="char-count" id="charCount">0/30</span>
          </div>
        </div>
      </section>

      <!-- Step 2: Layout selection -->
      <section class="step-section" id="step2" aria-label="Choose a layout">
        <h2 class="section-title">Choose your terminal style</h2>
        <div class="layout-grid" id="layoutGrid" role="radiogroup" aria-label="Terminal layout">
          <!-- Layout cards are generated by JS -->
        </div>
      </section>

      <!-- Generate button -->
      <div class="action-area" id="actionArea">
        <button class="generate-btn" id="generateBtn" disabled aria-describedby="privacyNote">
          <span class="btn-text">Generate &amp; Download</span>
          <span class="btn-loader" aria-hidden="true">
            <span class="spinner"></span>
            <span class="btn-status">Reading template...</span>
          </span>
          <div class="btn-progress"><div class="btn-progress-fill"></div></div>
        </button>
      </div>

      <!-- Terminal animation area (shown during generation) -->
      <div class="terminal-anim" id="terminalAnim" aria-hidden="true">
        <div class="terminal-anim-content" id="terminalAnimContent"></div>
      </div>

      <!-- Success section -->
      <section class="step-section success-section" id="successSection" style="display:none" aria-label="Download complete">
        <div class="success-icon" id="successIcon">
          <svg viewBox="0 0 80 80" width="80" height="80">
            <circle cx="40" cy="40" r="36" fill="none" stroke="#4ade80" stroke-width="3" class="success-ring"/>
            <polyline points="25 42 35 52 55 30" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="success-check"/>
          </svg>
        </div>
        <h2 class="success-title">PDF Generated Successfully!</h2>
        <p class="success-file" id="successFile"></p>
        <p class="success-size" id="successSize"></p>
        <div class="success-actions">
          <button class="btn-secondary" id="downloadAgainBtn">Download Again</button>
          <button class="btn-primary" id="makeAnotherBtn">Make Another</button>
        </div>
      </section>

      <!-- Error section -->
      <section class="step-section error-section" id="errorSection" style="display:none" aria-label="Error">
        <p class="error-message" id="errorMessage">Something went wrong. Please try again.</p>
        <button class="btn-primary" id="tryAgainBtn">Try Again</button>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p class="privacy-note" id="privacyNote">🔒 Your name never leaves your device.</p>
  </footer>

  <!-- Canvas for confetti -->
  <canvas id="confettiCanvas" aria-hidden="true"></canvas>

  <!-- ARIA live region for status announcements -->
  <div class="sr-only" role="status" aria-live="polite" id="statusAnnouncer"></div>

  <!-- Scripts: Verified jsPDF with local fallback & cache busting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="jspdf.umd.min.js?v=2.5.1"></script>
  <script src="data.js?v=2.0"></script>
  <script src="app.js?v=2.0"></script>
</body>
</html>
